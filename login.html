<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body>
    <div class="background-container">
        <div class="star star-orange top-left"></div>
        <div class="star star-blue right-mid"></div>
        <div class="star star-blue bottom-left"></div>
        <div class="star star-orange bottom-right"></div>
    </div>

    <div class="login-card">
        <h1 class="logo">C<i><b>ATA</b></i>LOG</h1>
        
        <h2 class="login-title">Login</h2>
        <p class="login-subtitle">Masukkan username dan password akunmu.</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            
            <button type="submit" id="loginBtn">Masuk</button>
        </form>
    </div>
</body>
</html>
